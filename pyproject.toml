[project]
name = "dsis-client"
version = "1.8.0"
description = "A Python client for communicating with DSIS"
readme = "README.md"
authors = []
requires-python = ">=3.11"
dependencies = [
	"msal",
	"requests>=2.28.0",
	"dsis-schemas[protobuf]>=0.0.11"
]
license = "MIT"
license-files = ["LICENSE"]

[tool.pyrefly]
project-includes = ["src"]

[project.optional-dependencies]
dev = [
	"pytest>=7.0.0",
	"pytest-cov>=4.0.0",
	"pytest-mock>=3.10.0",
	"ruff>=0.8.0",
	"pyrefly>=1.1.0",
]
examples = [
    "matplotlib>=3.5.0",
    "shapely>=2.0.0",
    "ipykernel>=6.0.0",
	"dotenv>=0.9.9",
]

[project.scripts]
dsis-client = "dsis_client:main"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
